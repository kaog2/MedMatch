services:
  # ─────────────────────────────────────────────────────────────
  # Database: PostgreSQL
  # ─────────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: medmatch-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DATABASE_USER:-medmatch}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?DATABASE_PASSWORD must be set}
      POSTGRES_DB: ${DATABASE_NAME:-medmatch}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    networks:
      - medmatch-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U medmatch -d medmatch"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─────────────────────────────────────────────────────────────
  # Machine translation: LibreTranslate (self-hosted, on-demand)
  # ─────────────────────────────────────────────────────────────
  libretranslate:
    image: libretranslate/libretranslate:latest
    container_name: medmatch-libretranslate
    restart: unless-stopped
    environment:
      LT_LOAD_ONLY: en,es,de,it
    ports:
      - "5001:5000"
    volumes:
      - libretranslate_models:/home/libretranslate/.local/share/argos-translate/packages
    networks:
      - medmatch-network

  # ─────────────────────────────────────────────────────────────
  # Backend: .NET Core Web API
  # ─────────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: medmatch-backend
    restart: unless-stopped
    environment:
      ASPNETCORE_ENVIRONMENT: ${ASPNETCORE_ENVIRONMENT:-Production}
      ASPNETCORE_URLS: http://+:8080

      # PostgreSQL connection
      DATABASE_HOST: ${DATABASE_HOST:-postgres}
      DATABASE_PORT: ${DATABASE_PORT:-5432}
      DATABASE_NAME: ${DATABASE_NAME:-medmatch}
      DATABASE_USER: ${DATABASE_USER:-medmatch}
      DATABASE_PASSWORD: ${DATABASE_PASSWORD:?DATABASE_PASSWORD must be set}

      # JWT / Auth
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      JWT_ISSUER: ${JWT_ISSUER:-medmatch}
      JWT_AUDIENCE: ${JWT_AUDIENCE:-medmatch-client}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}

      # CORS / Frontend
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost}
      SMTP_HOST: ${SMTP_HOST:?SMTP_HOST must be set}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USERNAME:?SMTP_USERNAME must be set}
      SMTP_PASSWORD: ${SMTP_PASSWORD:?SMTP_PASSWORD must be set}
      SMTP_FROM_EMAIL: ${SMTP_FROM_EMAIL:-}
      SMTP_FROM_NAME: ${SMTP_FROM_NAME:-MedMatch}
      SMTP_ALLOW_INVALID_CERTIFICATE: ${SMTP_ALLOW_INVALID_CERTIFICATE:-false}
      SEED_SAMPLE_DATA: ${SEED_SAMPLE_DATA:-false}
      SEED_CASE_DATA: ${SEED_CASE_DATA:-false}
      ADMIN_EMAIL: ${ADMIN_EMAIL:-admin@medmatch.test}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-AdminPass123!}
      LLM_MODERATION_ENABLED: ${LLM_MODERATION_ENABLED:-false}
      LLM_MODERATION_API_URL: ${LLM_MODERATION_API_URL:-}
      LLM_MODERATION_API_KEY: ${LLM_MODERATION_API_KEY:-}
      LLM_MODERATION_MODEL: ${LLM_MODERATION_MODEL:-gpt-4o-mini}
      LLM_MODERATION_AUTO_APPROVE: ${LLM_MODERATION_AUTO_APPROVE:-true}
      LIBRETRANSLATE_URL: ${LIBRETRANSLATE_URL:-http://libretranslate:5000}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-https://otel.example.com}
      OTEL_AUTH_TOKEN: ${OTEL_AUTH_TOKEN:-}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
      OTEL_SERVICE_NAME: ${OTEL_SERVICE_NAME:-medmatch-backend}
    ports:
      - "5000:8080"
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - medmatch-network

  # ─────────────────────────────────────────────────────────────
  # Frontend: React + TypeScript (Vite or CRA)
  # ─────────────────────────────────────────────────────────────
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        - NODE_ENV=development
    container_name: medmatch-frontend
    restart: unless-stopped
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      VITE_API_URL: ${VITE_API_URL:-http://localhost:5000}
      VITE_GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-https://otel.example.com}
      OTEL_AUTH_TOKEN: ${OTEL_AUTH_TOKEN:-}
      OTEL_EXPORTER_OTLP_HEADERS: ${OTEL_EXPORTER_OTLP_HEADERS:-}
      OTEL_SERVICE_NAME: ${VITE_OTEL_SERVICE_NAME:-medmatch-frontend}
      VITE_OTEL_EXPORTER_OTLP_ENDPOINT: ${VITE_OTEL_EXPORTER_OTLP_ENDPOINT:-https://otel.example.com}
      VITE_OTEL_AUTH_TOKEN: ${VITE_OTEL_AUTH_TOKEN:-}
      # If using Next.js instead of Vite, change to NEXT_PUBLIC_API_URL
    ports:
      - "3000:5173"
    depends_on:
      - backend
    networks:
      - medmatch-network
    volumes:
      - ./frontend:/app        # Source code
      - /app/node_modules      # To avoid overwriting node_modules from container
    command: ["npm", "run", "dev", "--", "--host", "0.0.0.0"]

  # ─────────────────────────────────────────────────────────────
  # Reverse proxy: Nginx
  # ─────────────────────────────────────────────────────────────
  nginx:
    image: nginx:alpine
    container_name: medmatch-nginx
    restart: unless-stopped
    ports:
      - "80:80"
      # In production, add 443 for HTTPS
    volumes:
      - ./infra/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - frontend
      - backend
    networks:
      - medmatch-network

networks:
  medmatch-network:
    driver: bridge

volumes:
  postgres_data:
  libretranslate_models:
